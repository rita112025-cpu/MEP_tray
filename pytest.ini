[pytest]
testpaths = tests
markers =
    autocad: 需要本機 AutoCAD（accoreconsole.exe）的整合測試；預設不執行，以 `pytest -m autocad` 執行
    revit: 需要 Revit 與 .NET SDK 的整合測試；預設不執行，以 `pytest -m revit` 執行
    slow: 單一測試超過數秒的完整驗證項（例如細格距搜尋上限）；預設不執行，以 `pytest -m slow` 或「完整驗證」步驟執行
addopts = -m "not autocad and not revit and not slow"
